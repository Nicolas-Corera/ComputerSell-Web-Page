<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b82f6" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png" />
    <title>Página no encontrada | ComputerSell</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #0d0f12;
      --bg-1: #14161c;
      --bg-2: #1c1f26;
      --line: rgba(255, 255, 255, 0.12);
      --header-h: 0px;
      --blue: #3b82f6;
      --blue-deep: #1e3a8a;
      --ink: #f2f4f6;
      --ink-soft: #a0a5ac;
      --font-display: "Inter", sans-serif;
      --font-body: "Montserrat", sans-serif;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 10px;
    }

    ::-webkit-scrollbar-button {
      display: none;
      width: 0;
      height: 0;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-0);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--bg-2);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--line);
    }

    [hidden] {
      display: none !important;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: var(--header-h);
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--bg-0);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    ul,
    li {
      list-style: none;
    }
    .error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .errorNumber {
      font-size: 10rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3rem;
    }
    .errorNumber > div:first-child,
    .errorNumber > div:last-child {
      font-size: 12rem;
    }
    .errorText {
      font-size: 20px;
      text-transform: upperCase;
    }
    .errorButton {
      margin-top: 2rem;
    }
    .errorButton a {
      color: var(--ink);
      text-decoration: none;
      border: 2px solid var(--ink);
      padding: 1rem 2rem;
      background-color: transparent;
      transition: all 0.2s ease-in-out;
    }
    .errorButton a:hover {
      background-color: var(--blue-deep);
      border: 2px solid var(--blue);
    }
    .footer {
      position: absolute;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.5rem 1.5rem;
      font-size: 14px;
      color: var(--ink-soft);
    }
    .footerLegals ul {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }
    .footerLegals a {
      color: inherit;
      text-decoration: none;
      transition: all 0.15s ease-in-out;
    }
    .footerLegals a:hover {
      color: var(--ink);
    }
    @media (max-width: 600px) {
      .footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .footerLegals ul {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0;
      }
    }
  </style>
  </head>
  <body>
    <div class="error">
      <div class="errorNumber">
        <div>4</div>
        <div>0</div>
        <div>4</div>
      </div>
      <div class="errorText">Página no encontrada</div>
      <div class="errorButton">
        <a href="/">Volver al inicio</a>
      </div>
    </div>
    <footer class="footer">
      <div class="footerTitle">
        <span>ComputerSell</span>
      </div>
      <div class="footerLegals">
        <ul>
          <li><a href="/terminos">Términos y Condiciones</a></li>
          <li><a href="/privacidad">Política de Privacidad</a></li>
          <li><a href="/cookies">Política de Cookies</a></li>
        </ul>
      </div>
    </footer>
  </body>
</html>
